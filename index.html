<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEMO UTILITY HUB</title>
  
  <!-- PWA 매니페스트 및 테마 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090a0f">

  <!-- 카카오톡 / SNS 오픈그래프 공유 태그 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NEMO">
  <meta property="og:title" content="NEMO | Link Escape">
  <meta property="og:description" content="카카오톡 인앱 웹뷰를 벗어나 기본 브라우저나 전용 앱으로 연결합니다.">
  <meta property="og:image" content="https://nemo4.github.io/page/logo.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #11131a;
      --card-border: #232733;
      --accent: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* 로고 공용 스타일 */
    .nemo-logo-box {
      display: inline-block;
      vertical-align: middle;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 860px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    .brand-text h1 { font-size: 17px; font-weight: 800; letter-spacing: 1px; }
    .brand-text p { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; }

    /* Main Container */
    main {
      width: 100%;
      max-width: 680px;
      padding: 50px 20px 80px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Hero */
    .hero-logo {
      width: 68px;
      height: 68px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .hero-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      text-align: center;
    }
    .hero-desc {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
      max-width: 480px;
      margin-bottom: 35px;
    }

    /* Tool 01 Card */
    .tool-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 26px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.3);
    }
    .tool-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .tag {
      background: rgba(37,99,235,0.15);
      color: #60a5fa;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .tool-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .tool-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.5; }

    input[type="url"], input[type="text"] {
      width: 100%;
      background: #090a0f;
      border: 1px solid #2e3446;
      border-radius: 8px;
      color: #fff;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 0;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: filter 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-green { background: #10b981; margin-top: 8px; }

    /* Footer */
    footer {
      width: 100%;
      border-top: 1px solid var(--card-border);
      padding: 28px 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .footer-logo { width: 26px; height: 26px; opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="./" class="brand-wrap">
      <div class="nemo-logo-box" style="width: 32px; height: 32px;">
        <svg viewBox="0 0 100 100" width="32" height="32">
          <rect width="100" height="100" fill="#000" />
          <rect x="7" y="7" width="86" height="86" fill="none" stroke="#fff" stroke-width="6" />
          <line x1="50" y1="7" x2="50" y2="93" stroke="#fff" stroke-width="5" />
          <line x1="7" y1="50" x2="93" y2="50" stroke="#fff" stroke-width="5" />
          <path d="M 20 42 L 20 18 L 36 34 L 36 18" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
          <path d="M 80 18 L 61 18 L 61 42 L 80 42 M 61 30 L 76 30" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
          <path d="M 20 82 L 20 58 L 28 70 L 36 58 L 36 82" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
          <rect x="61" y="58" width="19" height="24" fill="none" stroke="#fff" stroke-width="5.5" />
        </svg>
      </div>
      <div class="brand-text">
        <h1>NEMO</h1>
        <p>UTILITY HUB</p>
      </div>
    </a>
    <span class="tag" style="background: rgba(16,185,129,0.15); color: #34d399;">● READY</span>
  </header>

  <!-- Main Content -->
  <main>
    <div class="nemo-logo-box hero-logo">
      <svg viewBox="0 0 100 100" width="68" height="68">
        <rect width="100" height="100" fill="#000" />
        <rect x="7" y="7" width="86" height="86" fill="none" stroke="#fff" stroke-width="6" />
        <line x1="50" y1="7" x2="50" y2="93" stroke="#fff" stroke-width="5" />
        <line x1="7" y1="50" x2="93" y2="50" stroke="#fff" stroke-width="5" />
        <path d="M 20 42 L 20 18 L 36 34 L 36 18" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
        <path d="M 80 18 L 61 18 L 61 42 L 80 42 M 61 30 L 76 30" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
        <path d="M 20 82 L 20 58 L 28 70 L 36 58 L 36 82" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
        <rect x="61" y="58" width="19" height="24" fill="none" stroke="#fff" stroke-width="5.5" />
      </svg>
    </div>

    <h2 class="hero-title">NEMO TOOLBOX</h2>
    <p class="hero-desc">
      카카오톡 인앱 웹뷰를 건너뛰고 모바일 시스템 기본 브라우저나 공식 앱으로 즉시 연결하는 유틸리티입니다.
    </p>

    <!-- Tool 01: 외부 브라우저 탈출 링크 생성기 (유일 유지 카드) -->
    <div class="tool-card">
      <div class="tool-header">
        <span class="tag">TOOL 01</span>
      </div>
      <h3 class="tool-title">외부 브라우저 탈출 링크 생성기</h3>
      <p class="tool-desc">공유할 웹페이지나 유튜브 주소를 입력하면 카카오톡 전용 탈출 링크로 변환합니다.</p>

      <input type="url" id="targetUrl" placeholder="https://... 또는 유튜브 링크 입력" />
      <button class="btn" onclick="buildLink()">탈출 링크 생성하기</button>

      <div id="outputBox" style="display: none; margin-top: 16px; border-top: 1px solid var(--card-border); padding-top: 16px;">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">변환 완료 (카카오톡 공유용):</p>
        <input type="text" id="resultUrl" readonly onclick="this.select()" />
        <button class="btn btn-green" onclick="copyLink()">링크 복사하기</button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="nemo-logo-box footer-logo">
      <svg viewBox="0 0 100 100" width="26" height="26">
        <rect width="100" height="100" fill="#000" />
        <rect x="7" y="7" width="86" height="86" fill="none" stroke="#fff" stroke-width="6" />
        <line x1="50" y1="7" x2="50" y2="93" stroke="#fff" stroke-width="5" />
        <line x1="7" y1="50" x2="93" y2="50" stroke="#fff" stroke-width="5" />
        <path d="M 20 42 L 20 18 L 36 34 L 36 18" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
        <path d="M 80 18 L 61 18 L 61 42 L 80 42 M 61 30 L 76 30" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
        <path d="M 20 82 L 20 58 L 28 70 L 36 58 L 36 82" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="square" />
        <rect x="61" y="58" width="19" height="24" fill="none" stroke="#fff" stroke-width="5.5" />
      </svg>
    </div>
    <p>© NEMO Studio. All rights reserved.</p>
  </footer>

  <script>
    // 1. PWA 서비스 워커 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => {
        console.error('SW Error:', err);
      });
    }

    // 2. 파라미터 파싱
    const params = new URLSearchParams(window.location.search);
    const directTarget = params.get('u') || params.get('url');
    const sharedUrl = params.get('share_url');
    const sharedText = params.get('text');

    // 공유하기 데이터 추출
    let incomingTarget = sharedUrl || '';
    if (!incomingTarget && sharedText) {
      const match = sharedText.match(/https?:\/\/[^\s]+/);
      if (match) incomingTarget = match[0];
    }

    // -----------------------------------------------------------------
    // [분기 A] 카카오톡 등에서 링크를 눌러 들어왔을 때 -> 외부 브라우저 탈출
    // -----------------------------------------------------------------
    if (directTarget) {
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:90vh;gap:20px;">
          <div style="width:40px;height:40px;border:3px solid #232733;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
          <p style="font-size:15px;font-weight:600;">기본 브라우저로 이동 중입니다...</p>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      `;

      const ua = navigator.userAgent.toLowerCase();
      const isAndroid = /android/.test(ua);
      const isIOS = /iphone|ipad|ipod/.test(ua);

      let openUrl = directTarget;
      if (isAndroid) {
        const stripped = directTarget.replace(/^https?:\/\//, '');
        const scheme = directTarget.startsWith('http://') ? 'http' : 'https';
        openUrl = `intent://${stripped}#Intent;scheme=${scheme};action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end;`;
      } else if (isIOS) {
        openUrl = `kakaotalk://web/openExternal?url=${encodeURIComponent(directTarget)}`;
      }

      window.location.href = openUrl;

    // -----------------------------------------------------------------
    // [분기 B] 안드로이드 공유 메뉴에서 NEMO 앱을 눌렀을 때 -> 자동 복사
    // -----------------------------------------------------------------
    } else if (incomingTarget) {
      const base = window.location.origin + window.location.pathname;
      const finalNemoUrl = `${base}?u=${encodeURIComponent(incomingTarget)}`;

      navigator.clipboard.writeText(finalNemoUrl).then(() => {
        document.body.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:90vh;gap:16px;text-align:center;padding:20px;">
            <div style="font-size:42px;">📋</div>
            <h2 style="font-size:20px;font-weight:800;color:#fff;">탈출 링크 복사 완료!</h2>
            <p style="font-size:13px;color:#9ca3af;word-break:break-all;max-width:320px;">${finalNemoUrl}</p>
            <p style="font-size:14px;color:#60a5fa;margin-top:10px;">카카오톡 채팅방에 바로 붙여넣기 하세요.</p>
          </div>
        `;
      }).catch(() => {
        document.body.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:90vh;gap:16px;text-align:center;padding:20px;">
            <h2 style="font-size:20px;font-weight:800;color:#fff;">링크 변환 완료</h2>
            <input type="text" value="${finalNemoUrl}" id="copyField" style="width:100%;max-width:300px;padding:10px;border-radius:6px;border:1px solid #333;background:#111;color:#fff;" />
            <button onclick="navigator.clipboard.writeText('${finalNemoUrl}');alert('복사되었습니다!')" style="padding:12px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;">복사하기</button>
          </div>
        `;
      });
    }

    // -----------------------------------------------------------------
    // [수동 UI 기능]
    // -----------------------------------------------------------------
    function buildLink() {
      const val = document.getElementById('targetUrl').value.trim();
      if (!val) return alert('URL을 입력해주세요.');

      const finalUrl = /^https?:\/\//i.test(val) ? val : 'https://' + val;
      const base = window.location.origin + window.location.pathname;
      document.getElementById('resultUrl').value = `${base}?u=${encodeURIComponent(finalUrl)}`;
      document.getElementById('outputBox').style.display = 'block';
    }

    function copyLink() {
      const box = document.getElementById('resultUrl');
      box.select();
      navigator.clipboard.writeText(box.value).then(() => {
        alert('카톡 공유용 링크가 복사되었습니다!');
      });
    }
  </script>
</body>
</html>
