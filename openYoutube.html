<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영상으로 연결 중...</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 24px;
      background-color: #ff0000;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>YouTube 앱으로 연결하고 있습니다</h2>
  <p>자동으로 열리지 않으면 아래 버튼을 눌러주세요.</p>
  <a id="openBtn" class="btn" href="#">YouTube 앱에서 열기</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const listId = params.get('list') || params.get('id');
    const videoId = params.get('v');

    const ua = navigator.userAgent.toLowerCase();
    const isAndroid = /android/.test(ua);
    const isIOS = /iphone|ipad|ipod/.test(ua);

    let appTarget = '';
    let webFallback = 'https://www.youtube.com';

    if (listId) {
      webFallback = `https://www.youtube.com/playlist?list=${listId}`;
      if (isAndroid) {
        // 안드로이드 크롬/인앱 브라우저 표준 강제 앱 실행 인텐트
        appTarget = `intent://www.youtube.com/playlist?list=${listId}#Intent;package=com.google.android.youtube;scheme=https;end;`;
      } else if (isIOS) {
        // 아이폰 URL 스킴
        appTarget = `vnd.youtube://www.youtube.com/playlist?list=${listId}`;
      } else {
        appTarget = webFallback;
      }
    } else if (videoId) {
      webFallback = `https://youtu.be/${videoId}`;
      if (isAndroid) {
        appTarget = `intent://youtu.be/${videoId}#Intent;package=com.google.android.youtube;scheme=https;end;`;
      } else if (isIOS) {
        appTarget = `vnd.youtube://${videoId}`;
      } else {
        appTarget = webFallback;
      }
    }

    if (appTarget) {
      document.getElementById('openBtn').href = appTarget;

      // 1. 페이지 로드 즉시 앱 실행 트리거
      window.location.href = appTarget;

      // 2. PC 또는 앱 미설치 환경 대비 (1.5초 후 일반 웹 재생목록으로 이동)
      setTimeout(() => {
        window.location.href = webFallback;
      }, 1500);
    }
  </script>
</body>
</html>
